name: mycode

on:
  push:
    paths: ["packages/mycode/**", "mycode.yaml", "package.json", "bun.lock", ".github/workflows/mycode.yml"]
  pull_request:
    paths: ["packages/mycode/**", "mycode.yaml", "package.json", "bun.lock", ".github/workflows/mycode.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile --ignore-scripts --filter @mycode/runtime
      - run: bun run --cwd packages/mycode typecheck:tsc
      - run: bun run --cwd packages/mycode build
      - run: bun run --cwd packages/mycode test
